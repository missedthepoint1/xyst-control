appId: la.xyst.control
productName: XYST CONTROL
directories:
  output: release
  buildResources: build
# electron-vite fully bundles main/preload/renderer (incl. @xyst/core) into out/,
# so the packaged app needs no runtime node_modules — ship out/ + package.json only.
files:
  - out/**/*
  - package.json
npmRebuild: false
mac:
  category: public.app-category.video
  icon: build/icon.icns
  # Hardened runtime + capture-card (camera/mic) entitlements so the notarized build can still
  # use getUserMedia for SDI/HDMI live view. electron-builder auto-notarizes when Apple
  # credentials are present in the environment (APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD +
  # APPLE_TEAM_ID), and skips notarization otherwise so credential-free dev builds still work.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # macOS 15+ (Sequoia/Tahoe) gates all LAN traffic behind Local Network Privacy. Without this
  # usage string the system never prompts for the grant, so a Finder-launched app silently fails
  # to reach cameras on the wired subnet (terminal-launched works only because it inherits the
  # shell's grant). The string is the prompt text; its presence is what registers the app for the
  # grant. NSBonjourServices covers the optional mDNS (`canon-<MAC>.local`) camera discovery.
  extendInfo:
    NSLocalNetworkUsageDescription: >-
      XYST CONTROL connects to cameras on your local network to send control
      commands and receive status and live preview.
    NSBonjourServices:
      - _http._tcp
  # Universal (arm64 + x64) so the notarized build runs natively on Apple Silicon AND Intel Macs.
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
dmg:
  title: ${productName}
win:
  icon: build/icon.png
  target:
    - nsis
linux:
  icon: build/icon.png
  category: AudioVideo
  target:
    - AppImage
# Auto-update feed. electron-builder emits latest-mac.yml / latest.yml here so electron-updater
# (mac + win) can find new releases. owner/repo come from the `origin` remote.
publish:
  provider: github
  owner: missedthepoint1
  repo: xyst-control
  # Publish straight to a non-draft release (default is `draft`). This lets the CI workflow add
  # assets to an already-published release (e.g. a Windows installer onto a release cut locally on
  # a Mac), and removes the manual "un-draft" step from the local flow. The CI prepare job (or a
  # prior local run) pre-creates the release so concurrent artifact uploads don't race to create it.
  releaseType: release
