name: Release

# Builds + publishes the desktop app for Windows and/or macOS and attaches the installers (plus the
# electron-updater feeds latest.yml / latest-mac.yml) to the GitHub Release for the tag.
#
# Trigger:
#   - push a tag like v0.6.0  → builds that tag for BOTH platforms automatically
#   - "Run workflow" (manual) → pass an existing tag and pick which platforms to build. Use
#     `windows` to add a Windows installer to a release cut locally on a Mac WITHOUT rebuilding
#     (and clobbering) the notarized macOS assets.
#
# Signing is OPTIONAL — with no secrets the builds still succeed, just unsigned (Windows SmartScreen
# will warn; macOS won't be notarized). Add these repo secrets for fully signed/notarized output:
#   WIN_CSC_LINK            base64 of your Windows code-signing .pfx
#   WIN_CSC_KEY_PASSWORD    its password
#   MAC_CSC_LINK            base64 of your "Developer ID Application" .p12
#   MAC_CSC_KEY_PASSWORD    its password
#   APPLE_ID                Apple ID email (for notarization)
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password
#   APPLE_TEAM_ID           e.g. 8R445A26FP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v0.6.0)
        required: true
      platforms:
        description: Which platforms to build
        type: choice
        options:
          - both
          - windows
          - macos
        default: both

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Create the release up front (as a draft if it doesn't exist) so the build jobs upload into one
  # release instead of racing to create duplicates, and compute which platforms to build.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Ensure a draft release exists for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
          fi
      - id: set
        name: Compute build matrix
        run: |
          case "${{ github.event.inputs.platforms || 'both' }}" in
            windows) m='[{"os":"windows-latest"}]' ;;
            macos)   m='[{"os":"macos-latest"}]' ;;
            *)       m='[{"os":"windows-latest"},{"os":"macos-latest"}]' ;;
          esac
          echo "matrix={\"include\":$m}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      # Sparse-checkout only the build inputs: the repo tracks docs/sony-api-reference:/ (a literal
      # colon in the path) which is an illegal filename on Windows and aborts a full checkout. Cone
      # mode still pulls all root-level files (package.json, pnpm-lock.yaml, tsconfigs, …); we add the
      # workspace dirs and skip docs/ + sony-sdk/, which the build doesn't need.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          sparse-checkout: |
            packages
            scripts
            config
          sparse-checkout-cone-mode: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build renderer/main bundles
        run: pnpm --filter @xyst/app exec electron-vite build
      - name: Build + publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Per-OS code-signing cert (empty ⇒ unsigned, build still succeeds).
          CSC_LINK: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK || secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD || secrets.MAC_CSC_KEY_PASSWORD }}
          # macOS notarization (ignored on Windows; empty ⇒ notarization skipped).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @xyst/app exec electron-builder --publish always

  finalize:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --draft=false --latest
